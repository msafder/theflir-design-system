<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Instagram Post" description="1080×1080 feed master — figure field, mono announcement block, one red mark." -->
<helmet>
<script src="./ds-base.js"></script>
<style>html,body{margin:0;background:#0A0A0A}</style>
</helmet>
<div style="width:1080px;height:1080px;position:relative;background:#0A0A0A;overflow:hidden;color:#F2F2F2;font-family:var(--flir-font-body)">
<img src="../../assets/source/dbnelson-12.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:var(--flir-photo-filter)">
<div style="position:absolute;inset:0;background:var(--flir-crush)"></div>
<div style="position:absolute;inset:0;background-image:var(--flir-grain);opacity:0.7"></div>
<div style="position:absolute;inset:0;background-image:var(--flir-scanline)"></div>
<div style="position:absolute;inset:64px;display:flex;flex-direction:column;justify-content:space-between">
<div style="display:flex;justify-content:space-between;align-items:flex-start">
<div style="display:inline-flex;align-items:baseline;line-height:1;text-transform:uppercase;white-space:nowrap">
<span style="font-family:var(--flir-font-wordmark-the);font-size:36px">The</span><span style="font-family:var(--flir-font-wordmark-flir);font-size:72px">Flir</span>
</div>
<span style="font-family:var(--flir-font-data);font-size:20px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:#FFFFFF;background:#C00000;padding:8px 14px">{{ kicker }}</span>
</div>
<div style="display:flex;flex-direction:column;gap:28px">
<div style="font-family:var(--flir-font-display);font-size:112px;line-height:1;text-transform:uppercase">{{ title }}</div>
<div style="height:4px;background:#3F3F3F;width:100%"></div>
<div style="display:flex;justify-content:space-between;align-items:baseline;font-family:var(--flir-font-data);font-size:26px;letter-spacing:0.08em;text-transform:uppercase;color:#C8C8C8">
<span>{{ detail }}</span><span style="color:#8A8A8A">{{ catalogue }}</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1080},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Out now&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Human Butterfly&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;detail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;09 tracks · 41:22&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;catalogue&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;suture8-03&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      kicker: p.kicker ?? 'Out now',
      title: p.title ?? 'Human Butterfly',
      detail: p.detail ?? '09 tracks · 41:22',
      catalogue: p.catalogue ?? 'suture8-03',
    };
  }
}
</script>
</body>
</html>
