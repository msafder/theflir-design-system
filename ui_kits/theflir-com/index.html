<!DOCTYPE html><html lang="en" data-flir-theme="ink"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE FLIR</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="site.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{background:var(--flir-bg);color:var(--flir-fg);font-family:var(--flir-font-body);-webkit-font-smoothing:antialiased}
a{color:var(--flir-accent-text)}a:hover{color:var(--flir-fg)}
::selection{background:var(--flir-accent);color:var(--flir-accent-fg)}
button:focus-visible,a:focus-visible{outline:var(--flir-border-mark) solid var(--flir-focus);outline-offset:2px}</style>
</head><body><div id="root"></div>
<script>
/* Below 720px the site uses the .narrow layout in site.css. mobile.html sets
   the class unconditionally so the phone view survives any preview frame. */
const setNarrow = () => document.body.classList.toggle('narrow', window.innerWidth <= 720);
window.addEventListener('resize', setNarrow); setNarrow();
</script>
<script src="data.js"></script>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="MusicScreen.jsx"></script>
<script type="text/babel" src="LiveScreen.jsx"></script>
<script type="text/babel">
function Site() {
  const [route, setRoute] = React.useState('home');
  const go = (r) => { setRoute(r); window.scrollTo(0, 0); };
  /* Anything that is not a page name is a release id. */
  const Screen = { home: HomeScreen, music: MusicScreen, live: LiveScreen, contact: ContactScreen }[route] || ReleaseScreen;
  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <SiteHeader route={route} go={go} />
      <div style={{ flex: 1 }}><Screen id={route} go={go} /></div>
      <SiteFooter />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
</script></body></html>
