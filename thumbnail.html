<!DOCTYPE html><html lang="en" data-flir-theme="ink"><head><meta charset="utf-8"><title>THE FLIR</title><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 84px;overflow:hidden}
.mark{background:var(--flir-grey-00);display:flex;align-items:center;justify-content:center;padding:0 110px}
.mark img{width:100%;object-fit:contain;filter:invert(1)}
.strip{display:grid;grid-template-rows:repeat(3,1fr)}</style></head>
<body><div class="mark"><img src="assets/logo/THEFLIR_LOGO_BLACK.png" alt="THE FLIR"></div>
<div class="strip"><div style="background:var(--flir-red-hot)"></div><div style="background:var(--flir-red)"></div><div style="background:var(--flir-red-dim)"></div></div>
</body></html>
