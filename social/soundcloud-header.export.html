<!doctype html>
<html lang="en" data-flir-theme="ink">
<head>
<meta charset="utf-8">
<title>THE FLIR — SoundCloud profile header export 2480×520</title>
<link rel="stylesheet" href="../tokens/color.css">
<link rel="stylesheet" href="../tokens/type.css">
<link rel="stylesheet" href="../tokens/layout.css">
<!--
  EXPORT SURFACE — not a preview card. This page is exactly 2480×520 with no
  margin and no chrome, so a headless screenshot at that window size IS the
  asset. social/soundcloud-header.html embeds this file to document it; the
  artwork lives here only, so the two can never drift.

  Render:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=2480,520 --screenshot=soundcloud-header.png \
      http://127.0.0.1:PORT/social/soundcloud-header.export.html

  Serve over http rather than file:// — the local @font-face TTFs do not load
  reliably from file:// and the wordmark silently falls back to Impact.

  NO WORDMARK ON THIS SURFACE, deliberately. SoundCloud sets the artist name in
  its own UI immediately left of here, and the avatar carries the real lockup.
  A third instance in the same 1500px made the name stutter and put the
  platform's generic sans directly beside GDL-05's construction. The avatar is
  the surface that has to identify the band; this one does not.
-->
<style>
  html,body{margin:0;padding:0;background:var(--flir-bg);}

  /* True output size. Do not make this responsive — it is a fixed master. */
  .sc{position:relative;width:var(--flir-sc-header-w);height:var(--flir-sc-header-h);
    overflow:hidden;background:var(--flir-bg-sunken);}

  /* Same field and same pass as the theflir.com hero (web/hero.html): the
     profile header and the site homepage are the same object — the top of a
     page about the band — so they use the same photograph. The og:image runs
     the red flirbackground instead, but that is a 1.91:1 card appearing inline
     in a chat, which is a different job.

     Layer order follows the hero: image, grime, crush, grain, scanline, then
     type. Grain never sits over type.

     Only the vertical band is selectable. The source is 1200 wide and this
     canvas is 2480, so under `cover` the width is the binding dimension and the
     image fills it exactly — a horizontal background-position would be inert.
     28% takes the band with the stage beams running through the left and
     centre, while the right falls into the dark behind the figure — which is
     what the right-aligned type needs to sit on. Lower bands are the
     motion-blurred floor and read as a smear rather than as texture. */
  .sc__photo{position:absolute;inset:0;
    background-image:url('../assets/source/dbnelson-09.jpg');
    background-size:cover;background-position:center 28%;
    filter:var(--flir-photo-filter);}
  .sc__grime{position:absolute;inset:0;background:var(--flir-grime);}
  .sc__crush{position:absolute;inset:0;background:var(--flir-crush);}
  /* The hero uses --flir-grain; this uses the hard grain because it carries a
     2.07× upscale across a canvas more than twice the hero's width, and the
     soft grain leaves the flat areas visibly smooth at that size. */
  .sc__grain{position:absolute;inset:0;background:var(--flir-grain-hard);opacity:.45;}
  .sc__scan{position:absolute;inset:0;background:var(--flir-scanline);}
  /* Vignette, as the avatar master does. Earns its place here rather than
     being decoration: the right edge of this band carries a bright motion
     blur that came within a few px of the credit line, and darkening the
     perimeter is the treatment the system already has for that. */
  .sc__vig{position:absolute;inset:0;background:var(--flir-vignette);}

  /* Right-aligned, because the left is not available. SoundCloud draws the
     avatar and the artist-name block over the left of this banner out to
     roughly x 990, measured off the live profile, and the avatar is close to
     full height rather than sitting in the lower corner. The type starts at
     x 1100 to leave clearance. Chrome left, field centre, type right. */
  .sc__type{position:absolute;top:0;bottom:0;right:var(--flir-sc-margin);
    display:flex;flex-direction:column;justify-content:center;align-items:flex-end;
    text-align:right;}

  /* The one red on this surface. The field is greyscale here, so unlike the
     og:image — where the field itself is the red — a red rule is available and
     this is it. Nothing else may be red. Follows the story master's red-rule
     grammar, scaled: 8×240 at 1080 wide becomes 10×420 at 2480. */
  .sc__rule{width:420px;height:10px;background:var(--flir-accent);}

  .sc__line{font-family:var(--flir-font-data);font-weight:var(--flir-fw-medium);
    font-size:40px;letter-spacing:var(--flir-ls-wider);text-transform:uppercase;
    color:var(--flir-grey-99);margin-top:36px;}

  /* Credit: once per artefact, smallest type on the surface (GDL-04). */
  .sc__credit{font-family:var(--flir-font-data);font-size:21px;
    letter-spacing:var(--flir-ls-wider);text-transform:uppercase;
    color:var(--flir-grey-80);margin-top:26px;}
</style>
</head>
<body>
<div class="sc">
  <div class="sc__photo"></div>
  <div class="sc__grime"></div>
  <div class="sc__crush"></div>
  <div class="sc__grain"></div>
  <div class="sc__scan"></div>
  <div class="sc__vig"></div>

  <div class="sc__type">
    <div class="sc__rule"></div>
    <div class="sc__line">Official site · theflir.com</div>
    <div class="sc__credit">THE FLIR · MMXXVI</div>
  </div>
</div>
</body></html>
