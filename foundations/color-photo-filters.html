<!-- @dsCard group="Colors" viewport="700x200" name="Photo Filters" subtitle="Four passes that make unrelated shots read as one body of work" -->
<!DOCTYPE html><html lang="en" data-flir-theme="ink"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--flir-bg);color:var(--flir-fg);font-family:var(--flir-font-body);height:200px;box-sizing:border-box;padding:var(--flir-space-5);overflow:hidden}
.sw{display:flex;flex:1;min-width:0}.ramp{display:flex;height:64px;border:var(--flir-rule)}
.t{font-family:var(--flir-font-data);font-size:9px;letter-spacing:var(--flir-ls-wide);text-transform:uppercase;color:var(--flir-fg-faint);white-space:nowrap}
.cap{font-family:var(--flir-font-data);font-size:var(--flir-text-nano);letter-spacing:var(--flir-ls-wider);text-transform:uppercase;color:var(--flir-fg-faint)}
.row{display:flex;gap:var(--flir-space-4);align-items:center}.col{display:flex;flex-direction:column;gap:var(--flir-space-3)}
a{color:var(--flir-accent-text)}a:hover{color:var(--flir-red-hot)}
</style></head><body><div class="row" style="gap:var(--flir-space-3);align-items:stretch">
<div class="col" style="flex:1;gap:var(--flir-space-2)"><div style="height:110px;overflow:hidden;border:var(--flir-rule)"><img src="../assets/source/dbnelson-09.jpg" alt="" style="width:100%;height:100%;object-fit:cover;filter:var(--flir-photo-filter)"></div><span class="t">default</span></div><div class="col" style="flex:1;gap:var(--flir-space-2)"><div style="height:110px;overflow:hidden;border:var(--flir-rule)"><img src="../assets/source/dbnelson-09.jpg" alt="" style="width:100%;height:100%;object-fit:cover;filter:var(--flir-photo-filter-native)"></div><span class="t">native</span></div><div class="col" style="flex:1;gap:var(--flir-space-2)"><div style="height:110px;overflow:hidden;border:var(--flir-rule)"><img src="../assets/source/dbnelson-09.jpg" alt="" style="width:100%;height:100%;object-fit:cover;filter:var(--flir-photo-filter-figure)"></div><span class="t">figure</span></div><div class="col" style="flex:1;gap:var(--flir-space-2)"><div style="height:110px;overflow:hidden;border:var(--flir-rule)"><img src="../assets/source/dbnelson-09.jpg" alt="" style="width:100%;height:100%;object-fit:cover;filter:var(--flir-photo-filter-hot)"></div><span class="t">white-hot</span></div>
</div></body></html>
