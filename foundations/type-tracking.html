<!-- @dsCard group="Type" viewport="700x180" name="Tracking" subtitle="Everything uppercase gets tracked. Nothing lowercase does." -->
<!DOCTYPE html><html lang="en" data-flir-theme="ink"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--flir-bg);color:var(--flir-fg);font-family:var(--flir-font-body);height:180px;box-sizing:border-box;padding:var(--flir-space-5);overflow:hidden}
.sw{display:flex;flex:1;min-width:0}.ramp{display:flex;height:64px;border:var(--flir-rule)}
.t{font-family:var(--flir-font-data);font-size:9px;letter-spacing:var(--flir-ls-wide);text-transform:uppercase;color:var(--flir-fg-faint);white-space:nowrap}
.cap{font-family:var(--flir-font-data);font-size:var(--flir-text-nano);letter-spacing:var(--flir-ls-wider);text-transform:uppercase;color:var(--flir-fg-faint)}
.row{display:flex;gap:var(--flir-space-4);align-items:center}.col{display:flex;flex-direction:column;gap:var(--flir-space-3)}
a{color:var(--flir-accent-text)}a:hover{color:var(--flir-red-hot)}
</style></head><body><div class="col" style="gap:var(--flir-space-3)">
<div class="row" style="justify-content:space-between;border-bottom:var(--flir-rule);padding-bottom:var(--flir-space-2)"><span style="font-family:var(--flir-font-data);font-size:13px;letter-spacing:-0.02em;text-transform:uppercase">The Flir</span><span class="t">tight · -0.02em</span></div><div class="row" style="justify-content:space-between;border-bottom:var(--flir-rule);padding-bottom:var(--flir-space-2)"><span style="font-family:var(--flir-font-data);font-size:13px;letter-spacing:0;text-transform:uppercase">The Flir</span><span class="t">none · 0</span></div><div class="row" style="justify-content:space-between;border-bottom:var(--flir-rule);padding-bottom:var(--flir-space-2)"><span style="font-family:var(--flir-font-data);font-size:13px;letter-spacing:0.08em;text-transform:uppercase">The Flir</span><span class="t">wide · 0.08em</span></div><div class="row" style="justify-content:space-between;border-bottom:var(--flir-rule);padding-bottom:var(--flir-space-2)"><span style="font-family:var(--flir-font-data);font-size:13px;letter-spacing:0.16em;text-transform:uppercase">The Flir</span><span class="t">wider · 0.16em</span></div><div class="row" style="justify-content:space-between;border-bottom:var(--flir-rule);padding-bottom:var(--flir-space-2)"><span style="font-family:var(--flir-font-data);font-size:13px;letter-spacing:0.32em;text-transform:uppercase">The Flir</span><span class="t">widest · 0.32em</span></div>
</div></body></html>
