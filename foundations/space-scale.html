<!DOCTYPE html><html lang="en" data-flir-theme="ink"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--flir-bg);color:var(--flir-fg);font-family:var(--flir-font-body);height:150px;box-sizing:border-box;padding:var(--flir-space-5);overflow:hidden}
.sw{display:flex;flex:1;min-width:0}.ramp{display:flex;height:64px;border:var(--flir-rule)}
.t{font-family:var(--flir-font-data);font-size:9px;letter-spacing:var(--flir-ls-wide);text-transform:uppercase;color:var(--flir-fg-faint);white-space:nowrap}
.cap{font-family:var(--flir-font-data);font-size:var(--flir-text-nano);letter-spacing:var(--flir-ls-wider);text-transform:uppercase;color:var(--flir-fg-faint)}
.row{display:flex;gap:var(--flir-space-4);align-items:center}.col{display:flex;flex-direction:column;gap:var(--flir-space-3)}
a{color:var(--flir-accent-text)}a:hover{color:var(--flir-red-hot)}
</style></head><body><div class="row" style="align-items:flex-end;gap:var(--flir-space-3)">
<div class="col" style="gap:var(--flir-space-2);align-items:center"><div style="width:var(--flir-space-1);height:var(--flir-space-1);background:var(--flir-accent);min-width:4px"></div><span class="t">1</span></div><div class="col" style="gap:var(--flir-space-2);align-items:center"><div style="width:var(--flir-space-2);height:var(--flir-space-2);background:var(--flir-accent);min-width:4px"></div><span class="t">2</span></div><div class="col" style="gap:var(--flir-space-2);align-items:center"><div style="width:var(--flir-space-3);height:var(--flir-space-3);background:var(--flir-accent);min-width:4px"></div><span class="t">3</span></div><div class="col" style="gap:var(--flir-space-2);align-items:center"><div style="width:var(--flir-space-4);height:var(--flir-space-4);background:var(--flir-accent);min-width:4px"></div><span class="t">4</span></div><div class="col" style="gap:var(--flir-space-2);align-items:center"><div style="width:var(--flir-space-5);height:var(--flir-space-5);background:var(--flir-accent);min-width:4px"></div><span class="t">5</span></div><div class="col" style="gap:var(--flir-space-2);align-items:center"><div style="width:var(--flir-space-6);height:var(--flir-space-6);background:var(--flir-accent);min-width:4px"></div><span class="t">6</span></div><div class="col" style="gap:var(--flir-space-2);align-items:center"><div style="width:var(--flir-space-7);height:var(--flir-space-7);background:var(--flir-accent);min-width:4px"></div><span class="t">7</span></div><div class="col" style="gap:var(--flir-space-2);align-items:center"><div style="width:var(--flir-space-8);height:var(--flir-space-8);background:var(--flir-accent);min-width:4px"></div><span class="t">8</span></div><div class="col" style="gap:var(--flir-space-2);align-items:center"><div style="width:var(--flir-space-9);height:var(--flir-space-9);background:var(--flir-accent);min-width:4px"></div><span class="t">9</span></div><div class="col" style="gap:var(--flir-space-2);align-items:center"><div style="width:var(--flir-space-10);height:var(--flir-space-10);background:var(--flir-accent);min-width:4px"></div><span class="t">10</span></div>
</div></body></html>
