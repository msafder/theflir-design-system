<!DOCTYPE html><html lang="en" data-flir-theme="ink"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--flir-bg);color:var(--flir-fg);font-family:var(--flir-font-body);height:210px;box-sizing:border-box;padding:var(--flir-space-5);overflow:hidden}
.t{font-family:var(--flir-font-data);font-size:9px;letter-spacing:var(--flir-ls-wide);text-transform:uppercase;color:var(--flir-fg-faint);white-space:nowrap}
.f{position:relative;flex:1;overflow:hidden;border:var(--flir-rule)}.f img{width:100%;height:100%;object-fit:cover;display:block}
.f span{position:absolute;inset:0}
a{color:var(--flir-accent-text)}a:hover{color:var(--flir-red-hot)}</style></head>
<body><div style="display:flex;gap:var(--flir-space-3);align-items:stretch;height:100%">
<div style="display:flex;flex-direction:column;gap:var(--flir-space-2);flex:1"><div class="f"><img src="../assets/source/dbnelson-03.jpg" alt="" style="filter:var(--flir-photo-filter)"></div><span class="t">default filter</span></div>
<div style="display:flex;flex-direction:column;gap:var(--flir-space-2);flex:1"><div class="f"><img src="../assets/source/dbnelson-03.jpg" alt="" style="filter:var(--flir-photo-filter-corbijn)"></div><span class="t">corbijn filter</span></div>
<div style="display:flex;flex-direction:column;gap:var(--flir-space-2);flex:1"><div class="f"><img src="../assets/source/dbnelson-03.jpg" alt="" style="filter:var(--flir-photo-filter-corbijn)"><span style="background-image:var(--flir-grain-hard)"></span></div><span class="t">corbijn + grain-hard</span></div>
<div style="display:flex;flex-direction:column;gap:var(--flir-space-2);flex:1"><div class="f" style="background:var(--flir-grey-20)"><span style="background-image:var(--flir-grain-hard)"></span></div><span class="t">grain-hard, isolated</span></div>
</div></body></html>
