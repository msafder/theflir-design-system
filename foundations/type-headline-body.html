<!-- @dsCard group="Type" viewport="700x210" name="Headline & Body · Archivo" subtitle="Wide 700 for UI titles, normal 400 for copy" -->
<!DOCTYPE html><html lang="en" data-flir-theme="ink"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--flir-bg);color:var(--flir-fg);font-family:var(--flir-font-body);height:210px;box-sizing:border-box;padding:var(--flir-space-5);overflow:hidden}
.sw{display:flex;flex:1;min-width:0}.ramp{display:flex;height:64px;border:var(--flir-rule)}
.t{font-family:var(--flir-font-data);font-size:9px;letter-spacing:var(--flir-ls-wide);text-transform:uppercase;color:var(--flir-fg-faint);white-space:nowrap}
.cap{font-family:var(--flir-font-data);font-size:var(--flir-text-nano);letter-spacing:var(--flir-ls-wider);text-transform:uppercase;color:var(--flir-fg-faint)}
.row{display:flex;gap:var(--flir-space-4);align-items:center}.col{display:flex;flex-direction:column;gap:var(--flir-space-3)}
a{color:var(--flir-accent-text)}a:hover{color:var(--flir-red-hot)}
</style></head><body><div class="col">
<div class="flir-type-title" style="font-size:var(--flir-text-h2)">Tour dates announced</div>
<p class="flir-type-body" style="margin:0;max-width:56ch;color:var(--flir-fg-muted)">Archivo carries every UI-scale title and all body copy. The width axis is the voice: wide reads as a nameplate, condensed is reserved for the poster master where vertical space is the constraint.</p>
<span class="t">wdth 118 / 100 / 78 · wght 400 · 500 · 700 · 900</span>
</div></body></html>
