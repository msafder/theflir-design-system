<!-- @dsCard group="Colors" viewport="700x140" name="Grey Ramp" subtitle="13 steps — the instrument scale" -->
<!DOCTYPE html><html lang="en" data-flir-theme="ink"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--flir-bg);color:var(--flir-fg);font-family:var(--flir-font-body);height:140px;box-sizing:border-box;padding:var(--flir-space-5);overflow:hidden}
.sw{display:flex;flex:1;min-width:0}.ramp{display:flex;height:64px;border:var(--flir-rule)}
.t{font-family:var(--flir-font-data);font-size:9px;letter-spacing:var(--flir-ls-wide);text-transform:uppercase;color:var(--flir-fg-faint);white-space:nowrap}
.cap{font-family:var(--flir-font-data);font-size:var(--flir-text-nano);letter-spacing:var(--flir-ls-wider);text-transform:uppercase;color:var(--flir-fg-faint)}
.row{display:flex;gap:var(--flir-space-4);align-items:center}.col{display:flex;flex-direction:column;gap:var(--flir-space-3)}
a{color:var(--flir-accent-text)}a:hover{color:var(--flir-red-hot)}
</style></head><body><div class="col"><div class="ramp"><div class="sw" style="background:var(--flir-grey-00)"></div><div class="sw" style="background:var(--flir-grey-05)"></div><div class="sw" style="background:var(--flir-grey-10)"></div><div class="sw" style="background:var(--flir-grey-20)"></div><div class="sw" style="background:var(--flir-grey-30)"></div><div class="sw" style="background:var(--flir-grey-40)"></div><div class="sw" style="background:var(--flir-grey-50)"></div><div class="sw" style="background:var(--flir-grey-60)"></div><div class="sw" style="background:var(--flir-grey-70)"></div><div class="sw" style="background:var(--flir-grey-80)"></div><div class="sw" style="background:var(--flir-grey-90)"></div><div class="sw" style="background:var(--flir-grey-95)"></div><div class="sw" style="background:var(--flir-grey-99)"></div></div>
<div class="row" style="justify-content:space-between"><span class="t">00</span><span class="t">05</span><span class="t">10</span><span class="t">20</span><span class="t">30</span><span class="t">40</span><span class="t">50</span><span class="t">60</span><span class="t">70</span><span class="t">80</span><span class="t">90</span><span class="t">95</span><span class="t">99</span></div></div></body></html>
