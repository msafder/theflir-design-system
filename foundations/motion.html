<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Linear or ease-out. The instrument does not overshoot." -->
<!DOCTYPE html><html lang="en" data-flir-theme="ink"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--flir-bg);color:var(--flir-fg);font-family:var(--flir-font-body);height:150px;box-sizing:border-box;padding:var(--flir-space-5);overflow:hidden}
.sw{display:flex;flex:1;min-width:0}.ramp{display:flex;height:64px;border:var(--flir-rule)}
.t{font-family:var(--flir-font-data);font-size:9px;letter-spacing:var(--flir-ls-wide);text-transform:uppercase;color:var(--flir-fg-faint);white-space:nowrap}
.cap{font-family:var(--flir-font-data);font-size:var(--flir-text-nano);letter-spacing:var(--flir-ls-wider);text-transform:uppercase;color:var(--flir-fg-faint)}
.row{display:flex;gap:var(--flir-space-4);align-items:center}.col{display:flex;flex-direction:column;gap:var(--flir-space-3)}
a{color:var(--flir-accent-text)}a:hover{color:var(--flir-red-hot)}
</style></head><body><div class="col" style="gap:var(--flir-space-4)">
<div class="row" style="gap:var(--flir-space-4)"><span class="t" style="width:120px">motion-fast · 120ms</span><div style="flex:1;height:2px;background:var(--flir-line)"><div style="height:2px;width:40%;background:var(--flir-accent)"></div></div></div><div class="row" style="gap:var(--flir-space-4)"><span class="t" style="width:120px">motion-base · 200ms</span><div style="flex:1;height:2px;background:var(--flir-line)"><div style="height:2px;width:40%;background:var(--flir-accent)"></div></div></div><div class="row" style="gap:var(--flir-space-4)"><span class="t" style="width:120px">motion-slow · 400ms</span><div style="flex:1;height:2px;background:var(--flir-line)"><div style="height:2px;width:40%;background:var(--flir-accent)"></div></div></div>
<span class="t">--flir-ease · cubic-bezier(0.2, 0, 0, 1) · no bounce, no spring</span>
</div></body></html>
