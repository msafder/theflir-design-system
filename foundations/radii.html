<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="The system is square. One sanctioned exception." -->
<!DOCTYPE html><html lang="en" data-flir-theme="ink"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--flir-bg);color:var(--flir-fg);font-family:var(--flir-font-body);height:160px;box-sizing:border-box;padding:var(--flir-space-5);overflow:hidden}
.sw{display:flex;flex:1;min-width:0}.ramp{display:flex;height:64px;border:var(--flir-rule)}
.t{font-family:var(--flir-font-data);font-size:9px;letter-spacing:var(--flir-ls-wide);text-transform:uppercase;color:var(--flir-fg-faint);white-space:nowrap}
.cap{font-family:var(--flir-font-data);font-size:var(--flir-text-nano);letter-spacing:var(--flir-ls-wider);text-transform:uppercase;color:var(--flir-fg-faint)}
.row{display:flex;gap:var(--flir-space-4);align-items:center}.col{display:flex;flex-direction:column;gap:var(--flir-space-3)}
a{color:var(--flir-accent-text)}a:hover{color:var(--flir-red-hot)}
</style></head><body><div class="row" style="gap:var(--flir-space-5)">
<div class="col" style="gap:var(--flir-space-2)"><div style="width:110px;height:64px;border:var(--flir-rule-strong);border-radius:var(--flir-radius-none)"></div><span class="t">none 0 · default</span></div>
<div class="col" style="gap:var(--flir-space-2)"><div style="width:110px;height:64px;border:var(--flir-rule-strong);border-radius:var(--flir-radius-hair)"></div><span class="t">hair 2px</span></div>
<div class="col" style="gap:var(--flir-space-2)"><div style="width:110px;height:64px;border:var(--flir-border-mark) solid var(--flir-accent);border-radius:var(--flir-radius-pill);display:flex;align-items:center;justify-content:center"><span class="cap" style="color:var(--flir-accent-text)">Now playing</span></div><span class="t">pill · deviation, web chip only</span></div>
<div class="col" style="gap:var(--flir-space-2)"><div style="width:110px;height:64px;background:var(--flir-surface-raised);box-shadow:var(--flir-shadow-none);border:var(--flir-rule)"></div><span class="t">shadow-none · there is no elevation</span></div>
</div></body></html>
