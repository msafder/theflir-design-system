<!-- @dsCard group="Colors" viewport="700x170" name="Theme · Ink" subtitle="The default. Dark ships unless there's a reason not to." -->
<!DOCTYPE html><html lang="en" data-flir-theme="ink"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--flir-bg);color:var(--flir-fg);font-family:var(--flir-font-body);height:170px;box-sizing:border-box;padding:var(--flir-space-5);overflow:hidden}
.sw{display:flex;flex:1;min-width:0}.ramp{display:flex;height:64px;border:var(--flir-rule)}
.t{font-family:var(--flir-font-data);font-size:9px;letter-spacing:var(--flir-ls-wide);text-transform:uppercase;color:var(--flir-fg-faint);white-space:nowrap}
.cap{font-family:var(--flir-font-data);font-size:var(--flir-text-nano);letter-spacing:var(--flir-ls-wider);text-transform:uppercase;color:var(--flir-fg-faint)}
.row{display:flex;gap:var(--flir-space-4);align-items:center}.col{display:flex;flex-direction:column;gap:var(--flir-space-3)}
a{color:var(--flir-accent-text)}a:hover{color:var(--flir-red-hot)}
</style></head><body><div class="col">
<div class="ramp" style="height:56px"><div class="sw" style="background:var(--flir-bg)"></div><div class="sw" style="background:var(--flir-bg-sunken)"></div><div class="sw" style="background:var(--flir-surface)"></div><div class="sw" style="background:var(--flir-surface-raised)"></div><div class="sw" style="background:var(--flir-surface-inset)"></div><div class="sw" style="background:var(--flir-line)"></div><div class="sw" style="background:var(--flir-line-strong)"></div></div>
<div class="row" style="justify-content:space-between"><span class="t">bg</span><span class="t">sunken</span><span class="t">surface</span><span class="t">raised</span><span class="t">inset</span><span class="t">line</span><span class="t">line-str</span></div>
<div class="row"><span style="color:var(--flir-fg)">fg</span><span style="color:var(--flir-fg-muted)">muted</span><span style="color:var(--flir-fg-faint)">faint</span><span style="color:var(--flir-accent-text)">accent-text</span></div>
</div></body></html>
