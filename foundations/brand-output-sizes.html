<!-- @dsCard group="Brand" viewport="700x160" name="Output Sizes" subtitle="Every fixed surface the system ships to" -->
<!DOCTYPE html><html lang="en" data-flir-theme="ink"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--flir-bg);color:var(--flir-fg);font-family:var(--flir-font-body);height:160px;box-sizing:border-box;padding:var(--flir-space-5);overflow:hidden}
.sw{display:flex;flex:1;min-width:0}.ramp{display:flex;height:64px;border:var(--flir-rule)}
.t{font-family:var(--flir-font-data);font-size:9px;letter-spacing:var(--flir-ls-wide);text-transform:uppercase;color:var(--flir-fg-faint);white-space:nowrap}
.cap{font-family:var(--flir-font-data);font-size:var(--flir-text-nano);letter-spacing:var(--flir-ls-wider);text-transform:uppercase;color:var(--flir-fg-faint)}
.row{display:flex;gap:var(--flir-space-4);align-items:center}.col{display:flex;flex-direction:column;gap:var(--flir-space-3)}
a{color:var(--flir-accent-text)}a:hover{color:var(--flir-red-hot)}
</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--flir-space-2) var(--flir-space-5);font-family:var(--flir-font-data);font-size:var(--flir-text-small);color:var(--flir-fg-muted);line-height:1.7">
<div style="display:flex;justify-content:space-between;gap:var(--flir-space-3);border-bottom:var(--flir-rule);padding-bottom:4px"><span style="color:var(--flir-fg-faint);text-transform:uppercase;letter-spacing:var(--flir-ls-wide);font-size:10px">IG feed post</span><span>1080 × 1080</span></div><div style="display:flex;justify-content:space-between;gap:var(--flir-space-3);border-bottom:var(--flir-rule);padding-bottom:4px"><span style="color:var(--flir-fg-faint);text-transform:uppercase;letter-spacing:var(--flir-ls-wide);font-size:10px">IG story</span><span>1080 × 1920</span></div><div style="display:flex;justify-content:space-between;gap:var(--flir-space-3);border-bottom:var(--flir-rule);padding-bottom:4px"><span style="color:var(--flir-fg-faint);text-transform:uppercase;letter-spacing:var(--flir-ls-wide);font-size:10px">Reel grid crop</span><span>1080 × 1440</span></div><div style="display:flex;justify-content:space-between;gap:var(--flir-space-3);border-bottom:var(--flir-rule);padding-bottom:4px"><span style="color:var(--flir-fg-faint);text-transform:uppercase;letter-spacing:var(--flir-ls-wide);font-size:10px">CD jacket trim</span><span>4.75 in</span></div><div style="display:flex;justify-content:space-between;gap:var(--flir-space-3);border-bottom:var(--flir-rule);padding-bottom:4px"><span style="color:var(--flir-fg-faint);text-transform:uppercase;letter-spacing:var(--flir-ls-wide);font-size:10px">CD bleed / safe</span><span>0.125 / 0.25 in</span></div><div style="display:flex;justify-content:space-between;gap:var(--flir-space-3);border-bottom:var(--flir-rule);padding-bottom:4px"><span style="color:var(--flir-fg-faint);text-transform:uppercase;letter-spacing:var(--flir-ls-wide);font-size:10px">Gig poster</span><span>18 × 24 in</span></div>
</div></body></html>
