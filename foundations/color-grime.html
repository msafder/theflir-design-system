<!-- @dsCard group="Colors" viewport="700x180" name="Grime Layers" subtitle="Texture always lives under the type layer, never over it" -->
<!DOCTYPE html><html lang="en" data-flir-theme="ink"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--flir-bg);color:var(--flir-fg);font-family:var(--flir-font-body);height:180px;box-sizing:border-box;padding:var(--flir-space-5);overflow:hidden}
.sw{display:flex;flex:1;min-width:0}.ramp{display:flex;height:64px;border:var(--flir-rule)}
.t{font-family:var(--flir-font-data);font-size:9px;letter-spacing:var(--flir-ls-wide);text-transform:uppercase;color:var(--flir-fg-faint);white-space:nowrap}
.cap{font-family:var(--flir-font-data);font-size:var(--flir-text-nano);letter-spacing:var(--flir-ls-wider);text-transform:uppercase;color:var(--flir-fg-faint)}
.row{display:flex;gap:var(--flir-space-4);align-items:center}.col{display:flex;flex-direction:column;gap:var(--flir-space-3)}
a{color:var(--flir-accent-text)}a:hover{color:var(--flir-red-hot)}
</style></head><body><div class="row" style="gap:var(--flir-space-3);align-items:stretch">
<div class="col" style="flex:1;gap:var(--flir-space-2)"><div style="height:96px;border:var(--flir-rule);background:var(--flir-grey-20);background-image:var(--flir-grain)"></div><span class="t">grain</span></div><div class="col" style="flex:1;gap:var(--flir-space-2)"><div style="height:96px;border:var(--flir-rule);background:var(--flir-grey-20);background-image:var(--flir-grime)"></div><span class="t">grime</span></div><div class="col" style="flex:1;gap:var(--flir-space-2)"><div style="height:96px;border:var(--flir-rule);background:var(--flir-grey-20);background-image:var(--flir-crush)"></div><span class="t">crush</span></div><div class="col" style="flex:1;gap:var(--flir-space-2)"><div style="height:96px;border:var(--flir-rule);background:var(--flir-grey-20);background-image:var(--flir-scanline)"></div><span class="t">scanline</span></div><div class="col" style="flex:1;gap:var(--flir-space-2)"><div style="height:96px;border:var(--flir-rule);background:var(--flir-grey-20);background-image:var(--flir-vignette)"></div><span class="t">vignette</span></div>
</div></body></html>
