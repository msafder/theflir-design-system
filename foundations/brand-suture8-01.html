<!-- @dsCard group="Brand" viewport="700x240" name="suture8-01 Artwork" subtitle="The 2002 cover, and the archival colours sampled from it" -->
<!DOCTYPE html><html lang="en" data-flir-theme="ink"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--flir-bg);color:var(--flir-fg);font-family:var(--flir-font-body);height:240px;box-sizing:border-box;padding:var(--flir-space-5);overflow:hidden;display:flex;gap:var(--flir-space-5)}
.t{font-family:var(--flir-font-data);font-size:9px;letter-spacing:var(--flir-ls-wide);text-transform:uppercase;color:var(--flir-fg-faint);white-space:nowrap}
.cap{font-family:var(--flir-font-data);font-size:var(--flir-text-nano);letter-spacing:var(--flir-ls-wider);text-transform:uppercase;color:var(--flir-fg-muted)}
a{color:var(--flir-accent-text)}a:hover{color:var(--flir-red-hot)}</style></head>
<body>
<img src="../assets/source/suture8-01-cover.png" alt="suture8-01 cover" style="height:100%;aspect-ratio:1;object-fit:cover;border:var(--flir-rule);display:block">
<div style="flex:1;display:flex;flex-direction:column;gap:var(--flir-space-3);min-width:0">
<span class="cap">Archival · reproduction only</span>
<div style="display:flex;gap:var(--flir-space-3)">
<div style="flex:1;display:flex;flex-direction:column;gap:var(--flir-space-2)"><div style="height:52px;background:var(--flir-red-oxide);border:var(--flir-rule)"></div><span class="t">red-oxide</span><span class="t">#9E373C</span></div>
<div style="flex:1;display:flex;flex-direction:column;gap:var(--flir-space-2)"><div style="height:52px;background:var(--flir-red-oxide-deep);border:var(--flir-rule)"></div><span class="t">oxide-deep</span><span class="t">#703130</span></div>
<div style="flex:1;display:flex;flex-direction:column;gap:var(--flir-space-2)"><div style="height:52px;background:var(--flir-bone);border:var(--flir-rule)"></div><span class="t">bone</span><span class="t">#C9977A</span></div>
<div style="flex:1;display:flex;flex-direction:column;gap:var(--flir-space-2)"><div style="height:52px;background:var(--flir-red);border:var(--flir-rule)"></div><span class="t">brand red</span><span class="t">#C00000</span></div>
</div>
<p style="margin:0;font-size:var(--flir-text-small);line-height:var(--flir-lh-body);color:var(--flir-fg-muted);text-wrap:pretty">The 2002 ground is a warmer, duller red than the brand red beside it. It is a record of what was printed, not an addition to the palette — the two fight if they share a surface.</p>
</div>
</body></html>
