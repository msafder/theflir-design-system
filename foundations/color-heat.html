<!-- @dsCard group="Colors" viewport="700x180" name="Heat" subtitle="Brand red is locked. One per surface." -->
<!DOCTYPE html><html lang="en" data-flir-theme="ink"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--flir-bg);color:var(--flir-fg);font-family:var(--flir-font-body);height:180px;box-sizing:border-box;padding:var(--flir-space-5);overflow:hidden}
.sw{display:flex;flex:1;min-width:0}.ramp{display:flex;height:64px;border:var(--flir-rule)}
.t{font-family:var(--flir-font-data);font-size:9px;letter-spacing:var(--flir-ls-wide);text-transform:uppercase;color:var(--flir-fg-faint);white-space:nowrap}
.cap{font-family:var(--flir-font-data);font-size:var(--flir-text-nano);letter-spacing:var(--flir-ls-wider);text-transform:uppercase;color:var(--flir-fg-faint)}
.row{display:flex;gap:var(--flir-space-4);align-items:center}.col{display:flex;flex-direction:column;gap:var(--flir-space-3)}
a{color:var(--flir-accent-text)}a:hover{color:var(--flir-red-hot)}
</style></head><body><div class="row" style="gap:var(--flir-space-3)">
<div class="col" style="flex:1;gap:var(--flir-space-2)"><div style="height:72px;background:var(--flir-red);border:var(--flir-rule)"></div><span class="cap" style="color:var(--flir-fg)">red</span><span class="t">#C00000</span><span class="t">Brand. Locked.</span></div><div class="col" style="flex:1;gap:var(--flir-space-2)"><div style="height:72px;background:var(--flir-red-hot);border:var(--flir-rule)"></div><span class="cap" style="color:var(--flir-fg)">red-hot</span><span class="t">#E11414</span><span class="t">Hover · micro text</span></div><div class="col" style="flex:1;gap:var(--flir-space-2)"><div style="height:72px;background:var(--flir-red-dim);border:var(--flir-rule)"></div><span class="cap" style="color:var(--flir-fg)">red-dim</span><span class="t">#7A0000</span><span class="t">Large flat fills</span></div>
</div></body></html>
